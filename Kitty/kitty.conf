
# FONT
font_family JetBrainsMono Nerd Font
font_size 13.0


# CURSOR
cursor_shape beam
cursor_blink_interval 0


# WINDOW
remember_window_size yes
window_padding_width 10
window_border_width 1pt
confirm_os_window_close 1


# COLORS
foreground #c0caf5
background #1a1b26

selection_foreground #c0caf5
selection_background #414868

cursor #bb9af7
cursor_text_color #1a1b26


# ANSI COLORS
color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6

color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5


# BORDERS
active_border_color #bb9af7
inactive_border_color #414868


# TAB BAR
tab_bar_style fade
tab_bar_align left

active_tab_foreground #1a1b26
active_tab_background #bb9af7

inactive_tab_foreground #a9b1d6
inactive_tab_background #24283b


# TRANSPARENCY
background_opacity 0.90
background_blur 0


# SCROLLBACK
scrollback_lines 10000


# QUALITY OF LIFE
enable_audio_bell no
strip_trailing_spaces smart
